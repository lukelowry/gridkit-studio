name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match package.json version')
          JS
      - run: pnpm lint
        if: runner.os == 'Linux'
      - run: pnpm format:check
        if: runner.os == 'Linux'
      - run: pnpm build
        if: runner.os != 'Linux'
      - name: Package VSIX
        run: pnpm package
        if: runner.os == 'Linux'
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: gridkit-studio
          path: dist/gridkit-studio.vsix
          if-no-files-found: error
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vscode: ['1.96.0', stable]
      fail-fast: false
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
      GRIDKIT_TEST_SOFTWARE_GPU: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: dbus-run-session -- xvfb-run -a pnpm test:host
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: host-${{ matrix.vscode }}
          path: output/playwright
  solver:
    uses: ./.github/workflows/solver.yml
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, host, solver]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gridkit-studio
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset="dist/gridkit-studio-${RELEASE_TAG#v}.vsix"
          mv dist/gridkit-studio.vsix "$asset"
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "GridKit Studio $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$asset" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
