name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish release
        type: boolean
        default: false
      baselines:
        description: Redraw the pixel baselines
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}
jobs:
  # Format, lint, settings, types, unit tests and the VSIX, on every OS.
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm package
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: gridkit-studio
          path: dist/gridkit-studio-*.vsix
          if-no-files-found: error
  # The VSIX against real GridKit, from Studio's default image, in the oldest and newest VS Code.
  gridkit:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vscode: ['1.140.0', stable]
      fail-fast: false
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
      GRIDKIT_TEST_REQUIRED: '1'
      GRIDKIT_TEST_SOFTWARE_GPU: '1'
      GRIDKIT_UPDATE_BASELINES: ${{ inputs.baselines && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: gridkit-studio
          path: dist
      # Studio never pulls; the runner does, as a user would.
      - run: docker pull ghcr.io/lukelowry/gridkit:latest
      - run: pnpm test:simulation
      - run: dbus-run-session -- xvfb-run -a pnpm test:package
      - run: dbus-run-session -- xvfb-run -a pnpm test:ai
      - run: dbus-run-session -- xvfb-run -a pnpm test:trust
      - uses: actions/upload-artifact@v7
        if: inputs.baselines
        with:
          name: baselines-${{ matrix.vscode }}
          path: tests/vscode/baselines
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gridkit-${{ matrix.vscode }}
          path: |
            output/simulation
            output/packaged-*/playwright
            output/packaged-*/tests
  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish)
    needs: [check, gridkit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gridkit-studio
          path: dist
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset="$(ls dist/gridkit-studio-*.vsix)"
          tag="v$(unzip -p "$asset" extension/package.json | jq -er .version)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match package.json, which is $tag."
            exit 1
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            echo "$tag is already published. Bump package.json to publish another version." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if commit="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null)"; then
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$tag points to another commit. Use a new version."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --prerelease --verify-tag --title "GridKit Studio $tag" --generate-notes
          fi
          gh release upload "$tag" "$asset" --clobber
          gh release edit "$tag" --draft=false
