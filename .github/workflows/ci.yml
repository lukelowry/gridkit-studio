name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  # Format, lint, settings, types, unit tests and the VSIX, on every OS.
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm package
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: gridkit-studio
          path: dist/gridkit-studio-*.vsix
          if-no-files-found: error
  # The VSIX against real GridKit, from Studio's default image, in the oldest and newest VS Code.
  gridkit:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vscode: ['1.140.0', stable]
      fail-fast: false
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
      GRIDKIT_TEST_REQUIRED: '1'
      GRIDKIT_TEST_SOFTWARE_GPU: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: gridkit-studio
          path: dist
      # Studio never pulls; the runner does, as a user would.
      - run: docker pull ghcr.io/lukelowry/gridkit:latest
      - run: pnpm test:simulation
      - run: dbus-run-session -- xvfb-run -a pnpm test:package
      - run: dbus-run-session -- xvfb-run -a pnpm test:trust
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gridkit-${{ matrix.vscode }}
          path: |
            output/simulation
            output/packaged-*/playwright
            output/packaged-*/tests
  # A tag whose version matches package.json publishes that VSIX as a GitHub pre-release.
  release:
    if: github.ref_type == 'tag'
    needs: [check, gridkit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gridkit-studio
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="v$(unzip -p dist/gridkit-studio-*.vsix extension/package.json | jq -r .version)"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match package.json, which is $version."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/gridkit-studio-*.vsix \
            --prerelease --title "GridKit Studio $GITHUB_REF_NAME" --notes ""
