name: GridKit
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # GridKit is installed in the dev container, so what runs it is tested there.
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: pnpm test:devcontainer
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gridkit
          path: |
            output/
