name: GridKit runtime
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  solver:
    runs-on: ubuntu-latest
    env:
      GRIDKIT_TEST_IMAGE: ghcr.io/lukelowry/gridkit:arrow
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:solver
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: solver-results
          path: output/tests/solver-report.json
